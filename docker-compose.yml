services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: vanguard_ess
      MYSQL_USER: vanguard
      MYSQL_PASSWORD: change-me-local-only
      MYSQL_ROOT_PASSWORD: change-me-root-local-only
    command: --default-authentication-plugin=caching_sha2_password
    ports:
      - "3306:3306"
    volumes:
      - vanguard_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  vanguard_mysqldata:
